<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elderr | Software, markets, philosophy</title>
<meta name="description" content="Projects and writing on computer science, trading and philosophy.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
<style>
:root{--bg:#f2f0f9;--ink:#15121f;--mute:#6b6780;--card:#fff;--acc:#5b3df5;--d:'Bricolage Grotesque',system-ui,sans-serif;--b:'Newsreader',Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f0d17;--ink:#ece9f6;--mute:#9a96b0;--card:#1a1726;--acc:#a99bff}}
:root[data-theme=dark]{--bg:#0f0d17;--ink:#ece9f6;--mute:#9a96b0;--card:#1a1726;--acc:#a99bff}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 18px/1.6 var(--b)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px)}
header b{font:800 1.1rem var(--d);letter-spacing:-.01em}
#tg{border:1px solid var(--mute);background:none;border-radius:99px;padding:4px 14px;font:500 .85rem var(--d)}
main{max-width:1280px;margin:0 auto;padding:0 12px}
.intro{padding:6vh 8px 4vh}
h1{margin:0;max-width:15em;font:800 clamp(2.5rem,8.5vw,5.6rem)/1.02 var(--d);letter-spacing:-.035em}
.intro p{max-width:34em;margin:20px 0 0;color:var(--mute);font-size:1.15rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 8px 18px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--mute);background:none;border-radius:99px;padding:7px 16px;font:500 .9rem var(--d);transition:background .2s,color .2s}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{columns:2;column-gap:12px}
@media(min-width:760px){.grid{columns:3}}
@media(min-width:1150px){.grid{columns:4}}
.card{display:block;width:100%;margin:0 0 12px;padding:0;border:0;text-align:left;border-radius:22px;overflow:hidden;background:var(--card);break-inside:avoid;transition:transform .2s;animation:in .5s both;animation-delay:calc(var(--i)*45ms)}
.card:active{transform:scale(.97)}
.cover,.hero{display:flex;align-items:flex-end;background:linear-gradient(150deg,hsl(var(--hue) 85% 66%),hsl(calc(var(--hue) + 45) 80% 52%))}
.cover{height:var(--h);padding:14px}
.cover i,.hero i{font:800 3.2rem/1 var(--d);font-style:normal;color:rgba(255,255,255,.92)}
.meta{display:block;padding:12px 14px 14px}
.meta b{display:block;font:500 1rem/1.25 var(--d)}
.meta small,article small{color:var(--mute);font:500 .82rem var(--d)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.hero{height:46vh;min-height:260px;padding:24px;border-radius:0 0 32px 32px}
.hero i{font-size:clamp(4rem,16vw,9rem)}
article{max-width:660px;margin:0 auto;padding:28px 22px 80px}
article>*{animation:in .5s .22s both}
article h2{margin:6px 0 18px;font:800 clamp(1.9rem,6vw,2.8rem)/1.1 var(--d);letter-spacing:-.025em}
article p{margin:0 0 1em}
.ph{color:var(--mute);font-style:italic}
.x{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;z-index:2;width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;font-size:24px;backdrop-filter:blur(8px)}
footer{max-width:1280px;margin:0 auto;padding:48px 20px 56px}
footer h2{margin:0 0 12px;font:800 clamp(1.6rem,5vw,2.4rem) var(--d);letter-spacing:-.02em}
footer a{color:var(--acc);margin-right:20px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><b>Elderr</b><button id="tg">Dark</button></header>
<main>
  <section class="intro">
    <h1>I build software, study markets, and question how we think.</h1>
    <p>Projects and writing from computer science, trading and philosophy. Tap anything to open it.</p>
  </section>
  <nav class="chips" id="chips" aria-label="Filter by topic">
    <button data-c="all" aria-pressed="true">Everything</button>
    <button data-c="cs" aria-pressed="false">Computer science</button>
    <button data-c="tr" aria-pressed="false">Trading</button>
    <button data-c="ph" aria-pressed="false">Philosophy</button>
  </nav>
  <section class="grid" id="grid"></section>
</main>
<footer>
  <h2>Say hello</h2><p style="margin:0 0 12px;color:var(--mute)">Maxwell Ojochegbe Ojomah</p>
  <a href="mailto:hello@yourname.dev">hello@yourname.dev</a><a href="https://github.com/">GitHub</a><a href="https://x.com/">X</a>
</footer>
<script>
const D=[
{id:'flagship',c:'cs',t:'The project I want you to open first',h:270,hue:255,g:'&lt;/&gt;',b:'One sentence on what it does, one on why it matters, then the stack and a link to the code or demo.'},
{id:'first-year',c:'tr',t:'What I got wrong in my first year of trading',h:200,hue:160,g:'%',b:'Lessons about risk, patience and ego, told with real examples from your own journal.'},
{id:'outcome',c:'ph',t:'Is a good decision the same as a good outcome?',h:230,hue:28,g:'?',b:'A short essay where markets and philosophy meet: how to judge a choice when luck is involved.'},
{id:'language',c:'cs',t:'Writing a tiny language, step by step',h:180,hue:305,g:'λ',b:'A build log: lexer, parser, evaluator. Show the code and what surprised you.'},
{id:'sizing',c:'tr',t:'Position sizing, explained without jargon',h:250,hue:195,g:'$',b:'The one idea that protects you from yourself, with a simple worked example.'},
{id:'stoic',c:'ph',t:'Stoicism for people who check charts too often',h:190,hue:350,g:'¶',b:'What ancient advice on control and attention says about screens, prices and patience.'},
{id:'oss',c:'cs',t:'Open-source contributions',h:220,hue:215,g:'{ }',b:'Link the pull requests you are proudest of and say what each one fixed.'},
{id:'journal',c:'tr',t:'My trading journal template',h:170,hue:95,g:'✎',b:'A free template visitors can copy, and the fields that mattered most to you.'}];
const L={cs:'Computer science',tr:'Trading',ph:'Philosophy'};
const $=s=>document.querySelector(s),grid=$('#grid'),R=document.documentElement;
const anim=(e,k,n,o={})=>e.animate(k,{duration:matchMedia('(prefers-reduced-motion:reduce)').matches?1:n,easing:'cubic-bezier(.2,.8,.2,1)',...o}).finished;
let cat='all',open=null;
function render(){
  grid.innerHTML='';
  D.filter(d=>cat=='all'||d.c==cat).forEach((d,i)=>{
    const b=document.createElement('button');b.className='card';
    b.style.cssText=`--i:${i};--h:${d.h}px;--hue:${d.hue}`;
    b.innerHTML=`<span class="cover"><i>${d.g}</i></span><span class="meta"><b>${d.t}</b><small>${L[d.c]}</small></span>`;
    b.onclick=()=>openCard(d,b);grid.append(b);
  });
}
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;
  document.querySelectorAll('#chips button').forEach(x=>x.setAttribute('aria-pressed',x==b));render()};
function openCard(d,el){
  if(open)return;
  const r=el.getBoundingClientRect(),W=innerWidth,H=innerHeight,s=document.createElement('div');
  s.className='sheet';s.setAttribute('role','dialog');s.setAttribute('aria-modal','true');s.style.setProperty('--hue',d.hue);
  s.innerHTML=`<button class="x" aria-label="Close">×</button><div class="hero"><i>${d.g}</i></div><article><small>${L[d.c]}</small><h2>${d.t}</h2><p>${d.b}</p><p class="ph">Placeholder text. Replace it with your own write-up.</p></article>`;
  s.querySelector('.x').onclick=()=>close();
  document.body.append(s);document.body.style.overflow='hidden';
  open={s,el};history.pushState({o:1},'');
  anim(s,[{clipPath:`inset(${r.top}px ${W-r.right}px ${H-r.bottom}px ${r.left}px round 22px)`},{clipPath:'inset(0 0 0 0 round 0px)'}],520);
  s.querySelector('.x').focus({preventScroll:true});
}
async function close(fromPop,swipe){
  if(!open)return;const{s,el}=open;open=null;
  if(!fromPop&&history.state&&history.state.o)history.back();
  if(swipe)await anim(s,[{transform:s.style.transform||'none',opacity:1},{transform:'translateY(100%)',opacity:0}],260,{fill:'forwards'});
  else{const r=el.getBoundingClientRect(),W=innerWidth,H=innerHeight;
    await anim(s,[{clipPath:'inset(0 0 0 0 round 0px)'},{clipPath:`inset(${r.top}px ${W-r.right}px ${H-r.bottom}px ${r.left}px round 22px)`}],420,{fill:'forwards'});}
  s.remove();document.body.style.overflow='';el.focus({preventScroll:true});
}
addEventListener('popstate',()=>close(true));
addEventListener('keydown',e=>{if(e.key=='Escape')close()});
let y0=null,dy=0;
document.addEventListener('touchstart',e=>{y0=open&&open.s.scrollTop<=0?e.touches[0].clientY:null;dy=0},{passive:true});
document.addEventListener('touchmove',e=>{if(y0==null||!open)return;dy=e.touches[0].clientY-y0;
  if(dy>0){const s=open.s;s.style.transform=`translateY(${dy*.7}px) scale(${1-dy/1800})`;s.style.borderRadius=Math.min(dy/4,28)+'px'}},{passive:true});
document.addEventListener('touchend',()=>{if(y0==null||!open)return;y0=null;const s=open.s;
  if(dy>120)close(false,true);else{s.style.transition='transform .25s';s.style.transform='';s.style.borderRadius=''}});
$('#tg').onclick=function(){const dark=R.dataset.theme?R.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  R.dataset.theme=dark?'light':'dark';this.textContent=dark?'Dark':'Light'};
if(matchMedia('(prefers-color-scheme:dark)').matches)$('#tg').textContent='Light';
render();
</script>
</body>
</html>
