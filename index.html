{id:'luck',c:'tr',t:'Why a profitable backtest proves less than you think',h:270,hue:255,g:'1/2',real:true,b:`<p>I simulated 10,000 traders who each flip a fair coin every week. Heads is a win. A trader only counts as a winner by winning every single week.</p>
<pre><code>import random

traders = 10_000
weeks = 10

winners = 0
for _ in range(traders):
    if all(random.random() &lt; 0.5 for _ in range(weeks)):
        winners += 1

print(f"{winners} of {traders} traders won every week by pure luck")</code></pre>
<p>Before running anything I did the math. Ten weeks gives odds of 1 in 1,024, so about 10 winners out of 10,000. I ran <code>luck.py</code> six times and got 8, 7, 9, 5, 16 and 13. Those swing a lot, but they average 9.7, almost exactly what the math predicted. The 10 is an average. Any single run is a count of lucky traders, and that count is itself random.</p>
<p>At 20 weeks the odds drop to 1 in 1,048,576. Six runs gave 0 winners every time, which is what the math says to expect. I also got my own math wrong first. I divided the wrong way round and claimed about 105 winners. The real answer was about 0.01. A result above 1 from a sample that small should have been my warning.</p>

<p>Now scale up to a million traders. About one of them wins all 20 weeks by pure luck. If I only saw that trader's record, I would call them a genius. But the streak is exactly what randomness predicts from a million people flipping coins. What I cannot see is the denominator, the 999,999 who did not win.</p>
<p>A backtest has the same trap. Try enough strategies, settings and timeframes on the same past data and one will look brilliant by chance alone. The honest question is not whether it made money. It is how many things I tried before this one.</p>
<p><b>What I got wrong:</b> the division, and the instinct that a lucky winner needs an explanation.</p>
<p><i>This is thinking about risk, not trading advice. I have no verified track record.</i></p>`},

{id:'outcome',c:'ph',t:'Is a good decision the same as a good outcome?',h:230,hue:28,g:'?',b:'A short essay where markets and philosophy meet: how to judge a choice when luck is involved.'},
{id:'language',c:'cs',t:'Writing a tiny language, step by step',h:180,hue:305,g:'λ',b:'A build log: lexer, parser, evaluator. Show the code and what surprised you.'},
{id:'sizing',c:'tr',t:'Position sizing, explained without jargon',h:250,hue:195,g:'$',b:'The one idea that protects you from yourself, with a simple worked example.'},

{id:'journal',c:'tr',t:'My trading journal template',h:170,hue:95,g:'✎',b:'A free template visitors can copy, and the fields that mattered most to you.'}];
const L={cs:'Computer science',tr:'Trading',ph:'Philosophy'};
const $=s=>document.querySelector(s),grid=$('#grid'),R=document.documentElement;
const anim=(e,k,n,o={})=>e.animate(k,{duration:matchMedia('(prefers-reduced-motion:reduce)').matches?1:n,easing:'cubic-bezier(.2,.8,.2,1)',...o}).finished;
let cat='all',open=null;
function render(){
  grid.innerHTML='';
  D.filter(d=>cat=='all'||d.c==cat).forEach((d,i)=>{
    const b=document.createElement('button');b.className='card';
    b.style.cssText=`--i:${i};--h:${d.h}px;--hue:${d.hue}`;
    b.innerHTML=`<span class="cover"><i>${d.g}</i></span><span class="meta"><b>${d.t}</b><small>${L[d.c]}</small></span>`;
    b.onclick=()=>openCard(d,b);grid.append(b);
  });
}
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;
  document.querySelectorAll('#chips button').forEach(x=>x.setAttribute('aria-pressed',x==b));render()};
function openCard(d,el){
  if(open)return;
  const r=el.getBoundingClientRect(),W=innerWidth,H=innerHeight,s=document.createElement('div');
  s.className='sheet';s.setAttribute('role','dialog');s.setAttribute('aria-modal','true');s.style.setProperty('--hue',d.hue);
  s.innerHTML=`<button class="x" aria-label="Close">×</button><div class="hero"><i>${d.g}</i></div><article><small>${L[d.c]}</small><h2>${d.t}</h2>${d.real?d.b:`<p>${d.b}</p><p class="ph">Placeholder text. Replace it with your own write-up.</p>`}</article>`;
  s.querySelector('.x').onclick=()=>close();
  document.body.append(s);document.body.style.overflow='hidden';
  open={s,el};history.pushState({o:1},'');
  anim(s,[{clipPath:`inset(${r.top}px ${W-r.right}px ${H-r.bottom}px ${r.left}px round 22px)`},{clipPath:'inset(0 0 0 0 round 0px)'}],520);
  s.querySelector('.x').focus({preventScroll:true});
}
async function close(fromPop,swipe){
  if(!open)return;const{s,el}=open;open=null;
  if(!fromPop&&history.state&&history.state.o)history.back();
  if(swipe)await anim(s,[{transform:s.style.transform||'none',opacity:1},{transform:'translateY(100%)',opacity:0}],260,{fill:'forwards'});
  else{const r=el.getBoundingClientRect(),W=innerWidth,H=innerHeight;
    await anim(s,[{clipPath:'inset(0 0 0 0 round 0px)'},{clipPath:`inset(${r.top}px ${W-r.right}px ${H-r.bottom}px ${r.left}px round 22px)`}],420,{fill:'forwards'});}
  s.remove();document.body.style.overflow='';el.focus({preventScroll:true});
}
addEventListener('popstate',()=>close(true));
addEventListener('keydown',e=>{if(e.key=='Escape')close()});
let y0=null,dy=0;
document.addEventListener('touchstart',e=>{y0=open&&open.s.scrollTop<=0?e.touches[0].clientY:null;dy=0},{passive:true});
document.addEventListener('touchmove',e=>{if(y0==null||!open)return;dy=e.touches[0].clientY-y0;
  if(dy>0){const s=open.s;s.style.transform=`translateY(${dy*.7}px) scale(${1-dy/1800})`;s.style.borderRadius=Math.min(dy/4,28)+'px'}},{passive:true});
document.addEventListener('touchend',()=>{if(y0==null||!open)return;y0=null;const s=open.s;
  if(dy>120)close(false,true);else{s.style.transition='transform .25s';s.style.transform='';s.style.borderRadius=''}});
$('#tg').onclick=function(){const dark=R.dataset.theme?R.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  R.dataset.theme=dark?'light':'dark';this.textContent=dark?'Dark':'Light'};
if(matchMedia('(prefers-color-scheme:dark)').matches)$('#tg').textContent='Light';
render();
</script>
